<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 926" width="720" height="926" role="img" aria-labelledby="title desc">
<title id="title">Pipeline commands in run order</title>
<desc id="desc">The input is a folder of .cif files (--cif-dir). Four groups in a two by two grid process it. 1. Annotate: prepare-inputs (optional, run by hand), then finetune-prep. 2. Search: generate-msas or import-msas, then fetch-templates. 3. Hand off: materialize-dataset-cache, preprocess-templates, NPZ structure files, split-dataset, generate-train-config. Check: validate-dataset, then finetune-report. The output, ready for OpenFold3, is train.yml, dataset_cache.json, of3_compressed_structures/ and organized_msas/. Dashed boxes are stages that are optional or that a flag can skip.</desc>

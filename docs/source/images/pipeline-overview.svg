<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 822" width="720" height="822" role="img" aria-labelledby="title desc">
<title id="title">Pipeline commands in run order</title>
<desc id="desc">Four groups in a two by two grid. 1. Annotate: prepare-inputs (optional, run by hand), then finetune-prep. 2. Search: generate-msas or import-msas, then fetch-templates. 3. Hand off: materialize-dataset-cache, preprocess-templates, NPZ structure files, split-dataset, generate-train-config. Check: validate-dataset, then finetune-report. Dashed boxes are stages that are optional or that a flag can skip.</desc>
<rect x="20" y="20" width="300" height="208" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="36" y="46" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e3a5f">1. Annotate</text>
<rect x="400" y="20" width="300" height="208" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="416" y="46" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#3b0764">2. Search</text>
<rect x="40.0" y="60" width="260" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="170.0" y="80" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#1e3a5f">prepare-inputs</text>
<text x="170.0" y="99" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e3a5f" opacity="0.85">optional, run by hand</text>
<rect x="40.0" y="152" width="260" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="170.0" y="172" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#1e3a5f">finetune-prep</text>
<text x="170.0" y="191" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e3a5f" opacity="0.85">cleaned_structures/</text>
<rect x="420.0" y="60" width="260" height="56" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="550.0" y="80" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#3b0764">generate-msas or import-msas</text>
<text x="550.0" y="99" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#3b0764" opacity="0.85">organized_msas/</text>
<rect x="420.0" y="152" width="260" height="56" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="550.0" y="180.0" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#3b0764">fetch-templates</text>
<line x1="170.0" y1="120.0" x2="170.0" y2="137.0" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>

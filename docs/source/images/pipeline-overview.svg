<polygon points="394.0,124.0 382.0,130.6 382.0,117.4" fill="#8a8a8a"/>
<rect x="20" y="318" width="300" height="484" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="36" y="344" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#713f12">3. Hand off</text>
<rect x="400" y="318" width="300" height="208" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
